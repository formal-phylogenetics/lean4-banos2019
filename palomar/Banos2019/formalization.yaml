version: "v0.4"

project:
  name: "Identifying species network features from gene tree quartets under the coalescent model"
  description: >-
    A Lean formalization of Baños 2019, on what the quartet concordance factors of gene trees identify of a level-1
    species network under the network multispecies coalescent. No result of the literature is assumed. No person has
    reviewed the proofs.


    Proved: every numbered result of the paper. Among them, the computation of the concordance factors of quartet
    networks from those of trees (Theorem 2, Lemmas 7-11, Proposition 5); Theorem 3, that for generic parameters four
    taxa have three different concordance factors exactly when their induced unrooted network has a 4-cycle; and
    Theorem 4, that for generic parameters the orderings of the concordance factors identify the network obtained by
    contracting the 2- and 3-cycles and undirecting the hybrid edges of the 4-cycles. The cited results of Allman,
    Degnan, Rhodes 2011 and of Semple, Steel 2003 are proved from lean4-allman2011 and lean4-phylogenetics. The
    statements of record are Theorems 3 and 4 and Proposition 5, in the Challenge, on definitions in Mathlib's
    vocabulary, with eight theorems that check those definitions.


    The audit records 20 findings (E1-E20). Proposition 13 is false as printed, and is refuted and proved in a
    corrected form; Theorem 4 needs the nodes of degree two that the contraction leaves to be suppressed; the second
    claim of Proposition 7 fails at the vertices of the simplex; the other findings are gaps, all repaired, and
    misprints.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["q-bio.PE", "math.CO"]
  msc2020: ["92D15", "92B10", "60J90", "05C90", "05C38"]

