    id: "doi:10.1007/s11538-018-0485-4"
    type: "article"
    location: "https://doi.org/10.1007/s11538-018-0485-4"
    relationship: "formalizes"
    note: "Bull. Math. Biol. 81 (2019) 494-534. The published version is formalized, read in the PMC author manuscript PMC6344282, with the LaTeX source of arXiv:1711.10545v1, the only arXiv version; the report lists their differences."
